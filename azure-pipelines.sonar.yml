name: sonar.$(date:yyyyMMdd)$(rev:.r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  # Install .NET SDK
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
    displayName: 'Install SDK 10.0.x'
  # Build, test and analyze
  - task: SonarCloudPrepare@3
    inputs:
      SonarCloud: 'Silverback SonarCloud'
      organization: 'silverback'
      scannerMode: 'dotnet'
      projectKey: 'silverback'
      projectName: 'silverback'
      projectVersion: '5.0.0'
      extraProperties: |
        sonar.exclusions=**/obj/**,**/*.dll,docs/**
        sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/**/coverage.*.opencover.xml
        sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/*.trx
    displayName: 'Prepare code analysis on SonarCloud'
  - script: |
      dotnet build Silverback.slnx --configuration $(buildConfiguration)
    displayName: 'Build ($(buildConfiguration))'
  - script: |
      dotnet test Silverback.slnx \
        --configuration $(buildConfiguration) \
        --no-build \
        --verbosity Normal \
        --logger trx \
        --blame-hang-timeout 5m \
        --blame-hang-dump-type mini \
        --filter "Type!=E2E&Dependency!=Docker&CI!=Skip" \
        --collect "Code coverage" \
        -p:CollectCoverage=true \
        -p:CoverletOutputFormat=opencover%2ccobertura \
        -p:Exclude="[xunit.*]*%2c[Silverback.Tests.*]*"
    displayName: 'Run unit tests'
  - script: |
      dotnet test Silverback.slnx \
        --configuration $(buildConfiguration) \
        --no-build \
        --verbosity Normal \
        --logger trx \
        --blame-hang-timeout 5m \
        --blame-hang-dump-type mini \
        --filter "Type=E2E&Dependency!=Docker&CI!=Skip" \
        --collect "Code coverage" \
        -p:CollectCoverage=true \
        -p:CoverletOutputFormat=opencover%2ccobertura \
        -p:Exclude="[xunit.*]*%2c[Silverback.Tests.*]*"
    displayName: 'Run E2E tests'
  - task: SonarCloudAnalyze@3
    condition: succeededOrFailed()
    displayName: 'Run SonarCloud analysis'
  - task: SonarCloudPublish@3
    condition: succeededOrFailed()
    displayName: 'Publish SonarCloud quality gate result'
  # Publish results
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testRunner: 'VSTest'
      testResultsFiles: '**/*.trx'
    displayName: 'Publish test results'
  - script: |
      mkdir -p $(Build.ArtifactStagingDirectory)/blame
      # Skip the copies attached to the TRX results (TestResults/<run>/In/<machine>/)
      find tests -path '*/TestResults/*' -not -path '*/In/*' \( -name 'Sequence_*.xml' -o -name '*.dmp' \) -exec cp --parents {} $(Build.ArtifactStagingDirectory)/blame \;
      if [ -n "$(ls -A $(Build.ArtifactStagingDirectory)/blame)" ]; then
        echo "##vso[artifact.upload artifactname=blame-$(System.JobAttempt)]$(Build.ArtifactStagingDirectory)/blame"
      fi
    condition: failed()
    displayName: 'Publish hang dumps'
  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.*.cobertura.xml'
      codecoverageTool: 'Cobertura'
    displayName: 'Publish code coverage results'
