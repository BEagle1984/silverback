name: other-projects.$(date:yyyyMMdd)$(rev:.r)

parameters:
  - name: runIntegrationTests
    displayName: Run extended integration tests
    type: boolean
    default: false

variables:
  buildConfiguration: 'Release'
  enableLegacyVersionTests: false

jobs:
  - job: Build
    pool:
      vmImage: 'windows-latest'
    steps:
      # Install .NET SDK
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
        displayName: 'Install SDK 10.0.x'
      # Build nuget packages
      - pwsh: |
          cd nuget
          ./Update.ps1
        displayName: 'Build Silverback packages'
      - pwsh: |
          dotnet nuget add source "$(pwd)/nuget" --name local
          echo "$(pwd)/nuget added as package source"
        displayName: 'Set package source'
      # Build
      - script: |
          dotnet build ./samples/Silverback.Samples.sln --configuration $(buildConfiguration) | tee build.log && grep -q 'Build succeeded' build.log
        displayName: 'Build Samples ($(buildConfiguration))'
      - pwsh: |
          dotnet build ./tests/extended/Silverback.Tests.Extended.sln --configuration $(buildConfiguration) -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        displayName: 'Build Extended Tests ($(buildConfiguration))'

  - job: IntegrationTests
    condition: and(succeeded(), ${{ eq(parameters.runIntegrationTests, true) }})
    dependsOn: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          version: '10.0.x'
      - script: dotnet test tests/extended/Silverback.Tests.Extended.Integration/Silverback.Tests.Extended.Integration.csproj --configuration Release --logger trx --results-directory $(Common.TestResultsDirectory)/integration
        displayName: Run extended integration tests
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(Common.TestResultsDirectory)/integration/*.trx'
          failTaskOnFailedTests: true
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: tests/extended/artifacts
          artifact: integration-evidence
