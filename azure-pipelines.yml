name: continuous.$(date:yyyyMMdd)$(rev:.r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  # Install .NET SDK
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
    displayName: 'Install SDK 10.0.x'
  # Build and test
  - script: |
      dotnet build Silverback.sln --configuration $(buildConfiguration) -warnaserror | tee build.log && grep -q 'Build succeeded' build.log
    displayName: 'Build ($(buildConfiguration))'
  - script: |
      dotnet test Silverback.sln \
        --configuration $(buildConfiguration) \
        --no-build \
        --verbosity Normal \
        --logger trx \
        --blame-hang-timeout 5m \
        --blame-hang-dump-type mini \
        --filter "Type!=E2E&Dependency!=Docker&CI!=Skip"
    displayName: 'Run unit tests'
  - script: |
      dotnet test Silverback.sln \
        --configuration $(buildConfiguration) \
        --no-build \
        --verbosity Normal \
        --logger trx \
        --blame-hang-timeout 5m \
        --blame-hang-dump-type mini \
        --filter "Type=E2E&Dependency!=Docker&CI!=Skip"
    displayName: 'Run E2E tests'
  # Publish results
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testRunner: 'VSTest'
      testResultsFiles: '**/*.trx'
    displayName: 'Publish test results'
  - script: |
      mkdir -p $(Build.ArtifactStagingDirectory)/blame
      # Skip the copies attached to the TRX results (TestResults/<run>/In/<machine>/)
      find tests -path '*/TestResults/*' -not -path '*/In/*' \( -name 'Sequence_*.xml' -o -name '*.dmp' \) -exec cp --parents {} $(Build.ArtifactStagingDirectory)/blame \;
      if [ -n "$(ls -A $(Build.ArtifactStagingDirectory)/blame)" ]; then
        echo "##vso[artifact.upload artifactname=blame-$(System.JobAttempt)]$(Build.ArtifactStagingDirectory)/blame"
      fi
    condition: failed()
    displayName: 'Publish hang dumps'
