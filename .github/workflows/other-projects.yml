name: other-projects

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      runIntegrationTests:
        description: Run extended integration tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Build nuget packages
      - name: Build Silverback packages
        shell: pwsh
        run: |
          cd nuget
          ./Update.ps1
      - name: Set package source
        shell: pwsh
        run: |
          dotnet nuget add source "$(pwd)/nuget" --name local
          echo "$(pwd)/nuget added as package source"
      # Build
      - name: Build Samples (${{ env.BUILD_CONFIGURATION }})
        shell: bash
        run: |
          dotnet build ./samples/Silverback.Samples.slnx --configuration "$BUILD_CONFIGURATION" | tee build.log && grep -q 'Build succeeded' build.log
      - name: Build Extended Tests (${{ env.BUILD_CONFIGURATION }})
        shell: pwsh
        run: |
          dotnet build ./tests/extended/Silverback.Tests.Extended.slnx --configuration $env:BUILD_CONFIGURATION -warnaserror

  integration-tests:
    if: ${{ inputs.runIntegrationTests }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Run extended integration tests
        run: |
          dotnet test tests/extended/Silverback.Tests.Extended.Integration/Silverback.Tests.Extended.Integration.csproj \
            --configuration "$BUILD_CONFIGURATION" \
            --logger trx \
            --results-directory "$RUNNER_TEMP/integration"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results
          path: ${{ runner.temp }}/integration
          if-no-files-found: ignore
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-evidence
          path: tests/extended/artifacts
          if-no-files-found: ignore
