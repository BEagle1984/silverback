name: other-projects

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Build nuget packages
      - name: Build Silverback packages
        shell: pwsh
        run: |
          cd nuget
          ./Update.ps1
      - name: Set package source
        shell: pwsh
        run: |
          dotnet nuget add source "$(pwd)/nuget" --name local
          echo "$(pwd)/nuget added as package source"
      # Build
      - name: Build Samples (${{ env.BUILD_CONFIGURATION }})
        shell: bash
        run: |
          dotnet build ./samples/Silverback.Samples.slnx --configuration "$BUILD_CONFIGURATION" | tee build.log && grep -q 'Build succeeded' build.log
      - name: Build Extended Tests (${{ env.BUILD_CONFIGURATION }})
        shell: pwsh
        run: |
          dotnet build ./tests/extended/Silverback.Tests.Extended.slnx --configuration $env:BUILD_CONFIGURATION -warnaserror
