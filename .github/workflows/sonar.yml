name: sonar

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  sonar:
    # SONAR_TOKEN isn't available to fork and Dependabot pull requests
    if: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # SonarCloud needs the full history to assign the new code and the issues
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
      # Build, test and analyze
      # Rules ignored for the whole repository, because they are systematic false positives in this codebase (they are
      # ignored here and not in .editorconfig, because the scanner doesn't reliably honor the .editorconfig severities):
      # - S2436 (too many generic parameters): the fluent configuration API needs them by design
      # - S8949 (pass the cancellation token): the stop, complete and dispose paths deliberately don't use the token of
      #   the operation they cancel
      # - S1133 (remove the deprecated code): the obsolete members are kept until the next major version
      # - S2326 (unused type parameter): the typed marker interfaces (e.g. ICommand<TResult>) exist for the type parameter
      # - S8677 (Write-Host in a function): the scripts log with Write-Host on purpose, since Write-Output would mix the
      #   log lines into the functions' return values
      # - S6698 (password in docker-compose.yaml): it's the password of the local PostgreSQL used by the tests
      - name: Prepare code analysis on SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CSHARP_FILES: "**/*.cs"
        run: |
          version=$(dotnet msbuild src/Silverback.Core/Silverback.Core.csproj -getProperty:BaseVersion)
          dotnet sonarscanner begin \
            /k:silverback \
            /o:silverback \
            /n:silverback \
            /v:"$version" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300 \
            /d:sonar.exclusions="**/obj/**,**/*.dll,docs/**,.claude/**" \
            /d:sonar.issue.ignore.multicriteria="generics,cancellation,obsolete,markers,writehost,password" \
            /d:sonar.issue.ignore.multicriteria.generics.ruleKey=csharpsquid:S2436 \
            /d:sonar.issue.ignore.multicriteria.generics.resourceKey="$CSHARP_FILES" \
            /d:sonar.issue.ignore.multicriteria.cancellation.ruleKey=csharpsquid:S8949 \
            /d:sonar.issue.ignore.multicriteria.cancellation.resourceKey="$CSHARP_FILES" \
            /d:sonar.issue.ignore.multicriteria.obsolete.ruleKey=csharpsquid:S1133 \
            /d:sonar.issue.ignore.multicriteria.obsolete.resourceKey="$CSHARP_FILES" \
            /d:sonar.issue.ignore.multicriteria.markers.ruleKey=csharpsquid:S2326 \
            /d:sonar.issue.ignore.multicriteria.markers.resourceKey="$CSHARP_FILES" \
            /d:sonar.issue.ignore.multicriteria.writehost.ruleKey=powershelldre:S8677 \
            /d:sonar.issue.ignore.multicriteria.writehost.resourceKey="**/*.ps1" \
            /d:sonar.issue.ignore.multicriteria.password.ruleKey=secrets:S6698 \
            /d:sonar.issue.ignore.multicriteria.password.resourceKey=docker-compose.yaml \
            /d:sonar.cs.opencover.reportsPaths="$GITHUB_WORKSPACE/TestResults/**/coverage.opencover.*.xml" \
            /d:sonar.cs.vstest.reportsPaths="$GITHUB_WORKSPACE/TestResults/**/*.trx"
      - name: Build (${{ env.BUILD_CONFIGURATION }})
        run: |
          dotnet build Silverback.slnx --configuration "$BUILD_CONFIGURATION"
      - name: Run unit tests
        run: |
          dotnet test --solution Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --ignore-exit-code 8 \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini \
            --results-directory TestResults/unit \
            --results-directory-layout per-module \
            --filter "Type!=E2E&Dependency!=Docker&CI!=Skip" \
            --coverlet \
            --coverlet-output-format opencover \
            --coverlet-exclude "[xunit.*]*" \
            --coverlet-exclude "[Silverback.Tests.*]*" \
            --coverlet-exclude-assemblies-without-sources MissingAll
      - name: Run E2E tests
        run: |
          dotnet test --solution Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --ignore-exit-code 8 \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini \
            --results-directory TestResults/e2e \
            --results-directory-layout per-module \
            --filter "Type=E2E&Dependency!=Docker&CI!=Skip" \
            --coverlet \
            --coverlet-output-format opencover \
            --coverlet-exclude "[xunit.*]*" \
            --coverlet-exclude "[Silverback.Tests.*]*" \
            --coverlet-exclude-assemblies-without-sources MissingAll
      - name: Run SonarCloud analysis
        if: ${{ !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      # Publish results
      - name: Collect hang dumps
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/blame"
          # TestResults doesn't exist if the job failed before running the tests
          if [ -d TestResults ]; then
            find TestResults -name '*.dmp' -exec cp --parents {} "$RUNNER_TEMP/blame" \;
          fi
      - name: Publish hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blame-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blame
          if-no-files-found: ignore
