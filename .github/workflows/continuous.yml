name: continuous

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Called by the release workflow when it didn't run on the tagged commit yet
  workflow_call:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  # The job name is the status check required by the branch ruleset
  continuous:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To publish the test results as a check run with annotations and comment them on the pull request
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Build and test
      - name: Build (${{ env.BUILD_CONFIGURATION }})
        run: |
          dotnet build Silverback.slnx --configuration "$BUILD_CONFIGURATION" -warnaserror | tee build.log && grep -q 'Build succeeded' build.log
      # The unit and E2E tests run in a single pass, so that a failure doesn't hide the failures of the other tests
      - name: Run tests
        id: tests
        run: |
          dotnet test --solution Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --ignore-exit-code 8 \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini \
            --results-directory TestResults \
            --results-directory-layout per-module \
            --filter "Dependency!=Docker&CI!=Skip"
      # Publish results
      # The report is a check run, which annotates the failed tests at their source lines, except for fork and Dependabot pull
      # requests: their token is read-only, so the report falls back to the job summary. fail-on-error makes the check run
      # fail along with the tests (the job fails anyway, because of the test steps).
      - name: Publish test results
        id: test-results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test results
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed
          list-files: failed
          max-annotations: 50
          use-actions-summary: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
          fail-on-error: true
          fail-on-empty: false
      # Keeps a single comment on the pull request up to date: it's created when the tests fail and is updated on each push.
      # A pull request whose tests always passed gets no comment.
      - name: Comment the test results on the pull request
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true &&
          github.actor != 'dependabot[bot]' &&
          steps.tests.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The head of the pull request, not the merge commit that the workflow tests (GITHUB_SHA)
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FAILED: ${{ steps.test-results.outputs.failed }}
          SUMMARY_FILE: ${{ steps.test-results.outputs.summary_file }}
          CHECK_URL: ${{ steps.test-results.outputs.url_html }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          marker='<!-- continuous-test-results -->'
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          report_url="${CHECK_URL:-$RUN_URL}"
          body="$RUNNER_TEMP/test-results-comment.md"

          if [ "$TESTS_OUTCOME" = success ]; then
            if [ -z "$comment_id" ]; then
              echo "The tests passed and there is no comment to update."
              exit 0
            fi
            printf '%s\n### ✅ All tests passed\n\n[Test results](%s) of %s\n' "$marker" "$report_url" "$HEAD_SHA" > "$body"
          elif [ "${FAILED:-0}" -gt 0 ]; then
            printf '%s\n### ❌ %s tests failed\n\n[Test results](%s) of %s\n\n' "$marker" "$FAILED" "$report_url" "$HEAD_SHA" > "$body"
            # A comment is limited to 65536 characters
            if [ -n "$SUMMARY_FILE" ] && [ -f "$SUMMARY_FILE" ]; then
              head -c 60000 "$SUMMARY_FILE" >> "$body"
            fi
          else
            # E.g. a crashed or hanging test host, which doesn't report the failed test
            printf '%s\n### ❌ The tests failed without reporting a failed test\n\nThe test host may have crashed or hung: see the [workflow run](%s) of %s.\n' \
              "$marker" "$RUN_URL" "$HEAD_SHA" > "$body"
          fi

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F "body=@$body" > /dev/null
          fi
      - name: Collect hang dumps
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/blame"
          # TestResults doesn't exist if the job failed before running the tests
          if [ -d TestResults ]; then
            find TestResults -name '*.dmp' -exec cp --parents {} "$RUNNER_TEMP/blame" \;
          fi
      - name: Publish hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blame-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blame
          if-no-files-found: ignore
