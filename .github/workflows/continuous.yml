name: continuous

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  # The job name is the status check required by the branch ruleset
  continuous:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Build and test
      - name: Build (${{ env.BUILD_CONFIGURATION }})
        run: |
          dotnet build Silverback.slnx --configuration "$BUILD_CONFIGURATION" -warnaserror | tee build.log && grep -q 'Build succeeded' build.log
      - name: Run unit tests
        run: |
          dotnet test Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --verbosity Normal \
            --logger trx \
            --blame-hang-timeout 5m \
            --blame-hang-dump-type mini \
            --filter "Type!=E2E&Dependency!=Docker&CI!=Skip"
      - name: Run E2E tests
        run: |
          dotnet test Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --verbosity Normal \
            --logger trx \
            --blame-hang-timeout 5m \
            --blame-hang-dump-type mini \
            --filter "Type=E2E&Dependency!=Docker&CI!=Skip"
      # Publish results
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test results
          path: tests/**/TestResults/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed
          fail-on-error: false
          fail-on-empty: false
      - name: Collect hang dumps
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/blame"
          # Skip the copies attached to the TRX results (TestResults/<run>/In/<machine>/)
          find tests -path '*/TestResults/*' -not -path '*/In/*' \( -name 'Sequence_*.xml' -o -name '*.dmp' \) -exec cp --parents {} "$RUNNER_TEMP/blame" \;
      - name: Publish hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blame-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blame
          if-no-files-found: ignore
