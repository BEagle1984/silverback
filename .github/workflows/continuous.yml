name: continuous

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Called by the release workflow when it didn't run on the tagged commit yet
  workflow_call:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release

jobs:
  # The job name is the status check required by the branch ruleset
  continuous:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To publish the test results as a check run with annotations and comment them on the pull request
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install .NET SDK
      - name: Install SDK 10.0.x
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # Build and test
      - name: Build (${{ env.BUILD_CONFIGURATION }})
        run: |
          dotnet build Silverback.slnx --configuration "$BUILD_CONFIGURATION" -warnaserror | tee build.log && grep -q 'Build succeeded' build.log
      # The unit and E2E tests run in a single pass, so that a failure doesn't hide the failures of the other tests
      - name: Run tests
        id: tests
        run: |
          dotnet test --solution Silverback.slnx \
            --configuration "$BUILD_CONFIGURATION" \
            --no-build \
            --ignore-exit-code 8 \
            --report-trx \
            --hangdump \
            --hangdump-timeout 5m \
            --hangdump-type Mini \
            --results-directory TestResults \
            --results-directory-layout per-module \
            --filter "Dependency!=Docker&CI!=Skip"
      # Publish results
      # The results are published as a check run, in the job summary and, on pull requests, in a single comment that is updated
      # on each push. The token of fork and Dependabot pull requests is read-only, so they get the job summary only.
      # The step doesn't fail the job: the test steps already do when tests fail, and a reporting error shouldn't.
      - name: Publish test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          files: TestResults/**/*.trx
          check_name: Test results
          check_run: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
          comment_mode: ${{ (github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') && 'off' || 'always' }}
          # Without it, every test of the solution is listed in the check run
          check_run_annotations: none
      - name: Collect hang dumps
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/blame"
          # TestResults doesn't exist if the job failed before running the tests
          if [ -d TestResults ]; then
            find TestResults -name '*.dmp' -exec cp --parents {} "$RUNNER_TEMP/blame" \;
          fi
      - name: Publish hang dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blame-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blame
          if-no-files-found: ignore
