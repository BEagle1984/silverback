<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654 208" width="654" height="208" role="img" aria-labelledby="title desc">
  <title id="title">Outbound routing</title>
  <desc id="desc">The router sends message 1 to both topics, message 2 to the first topic and message 3 to the second one. Each consumer receives the messages of its topic.</desc>
  <defs>
    <style>
      .label { font: 600 12px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #6b7685; }
      .sub { font: 600 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .06em; fill: #6b7685; }
      .num { font: 700 15px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .small { font: 700 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .title { font: 700 13px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #3b82f6; }
      .text { font: 600 14px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #7d8796; }
      .card { fill: rgba(139, 149, 163, .10); stroke: rgba(139, 149, 163, .38); stroke-width: 1.25; }
      .group { fill: rgba(139, 149, 163, .08); stroke: rgba(139, 149, 163, .55); stroke-width: 1.25; stroke-dasharray: 5 4; }
      .slot { fill: none; stroke: rgba(139, 149, 163, .45); stroke-width: 1.25; stroke-dasharray: 4 4; }
      .flow { fill: none; stroke: #8b95a3; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="label" x="66" y="26" text-anchor="middle">PRODUCER</text>
  <text class="label" x="379" y="26" text-anchor="middle">TOPICS</text>
  <text class="label" x="571" y="26" text-anchor="middle">CONSUMERS</text>

  <!-- Producer -->
  <rect class="card" x="24" y="40" width="84" height="152" rx="12"/>
  <rect x="47" y="54" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="66" y="73" dy=".35em" text-anchor="middle">1</text>
  <rect x="47" y="97" width="38" height="38" rx="8" fill="#ea580c"/><text class="num" x="66" y="116" dy=".35em" text-anchor="middle">2</text>
  <rect x="47" y="140" width="38" height="38" rx="8" fill="#059669"/><text class="num" x="66" y="159" dy=".35em" text-anchor="middle">3</text>
  <line class="flow" x1="118" y1="116" x2="146" y2="116" marker-end="url(#arrow)"/>

  <!-- Router -->
  <rect class="card" x="158" y="86" width="96" height="60" rx="12"/>
  <text class="label" x="206" y="120" text-anchor="middle">ROUTER</text>
  <path class="flow" d="M264 116 C 288 116 286 73 308 73" marker-end="url(#arrow)"/>
  <path class="flow" d="M264 116 C 288 116 286 159 308 159" marker-end="url(#arrow)"/>

  <!-- Topics and consumers -->
  <rect class="card" x="320" y="40" width="118" height="66" rx="12"/>
  <rect x="336" y="54" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="355" y="73" dy=".35em" text-anchor="middle">1</text>
  <rect x="384" y="54" width="38" height="38" rx="8" fill="#ea580c"/><text class="num" x="403" y="73" dy=".35em" text-anchor="middle">2</text>
  <line class="flow" x1="450" y1="73" x2="500" y2="73" marker-end="url(#arrow)"/>
  <rect class="card" x="512" y="40" width="118" height="66" rx="12"/>
  <rect x="528" y="54" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="547" y="73" dy=".35em" text-anchor="middle">1</text>
  <rect x="576" y="54" width="38" height="38" rx="8" fill="#ea580c"/><text class="num" x="595" y="73" dy=".35em" text-anchor="middle">2</text>
  <rect class="card" x="320" y="126" width="118" height="66" rx="12"/>
  <rect x="336" y="140" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="355" y="159" dy=".35em" text-anchor="middle">1</text>
  <rect x="384" y="140" width="38" height="38" rx="8" fill="#059669"/><text class="num" x="403" y="159" dy=".35em" text-anchor="middle">3</text>
  <line class="flow" x1="450" y1="159" x2="500" y2="159" marker-end="url(#arrow)"/>
  <rect class="card" x="512" y="126" width="118" height="66" rx="12"/>
  <rect x="528" y="140" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="547" y="159" dy=".35em" text-anchor="middle">1</text>
  <rect x="576" y="140" width="38" height="38" rx="8" fill="#059669"/><text class="num" x="595" y="159" dy=".35em" text-anchor="middle">3</text>
</svg>
