<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 140" width="704" height="140" role="img" aria-labelledby="title desc">
  <title id="title">Chained error policies</title>
  <desc id="desc">A failed message is retried 3 times every second, then 5 more times every 30 seconds, and finally moved to the dead-letter topic.</desc>
  <defs>
    <style>
      .label { font: 600 12px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #6b7685; }
      .sub { font: 600 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .06em; fill: #6b7685; }
      .num { font: 700 15px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .small { font: 700 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .title { font: 700 13px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #3b82f6; }
      .text { font: 600 14px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #7d8796; }
      .card { fill: rgba(139, 149, 163, .10); stroke: rgba(139, 149, 163, .38); stroke-width: 1.25; }
      .group { fill: rgba(139, 149, 163, .08); stroke: rgba(139, 149, 163, .55); stroke-width: 1.25; stroke-dasharray: 5 4; }
      .slot { fill: none; stroke: rgba(139, 149, 163, .45); stroke-width: 1.25; stroke-dasharray: 4 4; }
      .flow { fill: none; stroke: #8b95a3; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Failed message -->
  <rect x="24" y="51" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="43" y="70" dy=".35em" text-anchor="middle">1</text>
  <circle cx="62" cy="51" r="9" fill="#dc2626"/><path d="M58.5 47.5 L65.5 54.5 M65.5 47.5 L58.5 54.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line class="flow" x1="80" y1="70" x2="108" y2="70" marker-end="url(#arrow)"/>

  <!-- Policy 1 -->
  <rect class="card" x="120" y="24" width="160" height="92" rx="12"/>
  <text class="title" x="200" y="52" text-anchor="middle">RETRY</text>
  <text class="text" x="200" y="77" text-anchor="middle">3× · every 1s</text>
  <text class="sub" x="200" y="101" text-anchor="middle">FAILURES 1–3</text>
  <line class="flow" x1="292" y1="70" x2="308" y2="70" marker-end="url(#arrow)"/>

  <!-- Policy 2 -->
  <rect class="card" x="320" y="24" width="160" height="92" rx="12"/>
  <text class="title" x="400" y="52" text-anchor="middle">RETRY</text>
  <text class="text" x="400" y="77" text-anchor="middle">5× · every 30s</text>
  <text class="sub" x="400" y="101" text-anchor="middle">FAILURES 4–8</text>
  <line class="flow" x1="492" y1="70" x2="508" y2="70" marker-end="url(#arrow)"/>

  <!-- Policy 3 -->
  <rect class="card" x="520" y="24" width="160" height="92" rx="12"/>
  <text class="title" x="600" y="52" text-anchor="middle">MOVE</text>
  <text class="text" x="600" y="77" text-anchor="middle">to dead-letter</text>
  <text class="sub" x="600" y="101" text-anchor="middle">9TH FAILURE</text>
</svg>
