<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 206" width="522" height="206" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end encryption</title>
  <desc id="desc">The producer encrypts three messages, which are stored encrypted in the topic and decrypted by the consumer.</desc>
  <defs>
    <style>
      .label { font: 600 12px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #6b7685; }
      .sub { font: 600 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .06em; fill: #6b7685; }
      .num { font: 700 15px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .small { font: 700 11px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #ffffff; }
      .title { font: 700 13px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; letter-spacing: .09em; fill: #3b82f6; }
      .text { font: 600 14px Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; fill: #7d8796; }
      .card { fill: rgba(139, 149, 163, .10); stroke: rgba(139, 149, 163, .38); stroke-width: 1.25; }
      .group { fill: rgba(139, 149, 163, .08); stroke: rgba(139, 149, 163, .55); stroke-width: 1.25; stroke-dasharray: 5 4; }
      .slot { fill: none; stroke: rgba(139, 149, 163, .45); stroke-width: 1.25; stroke-dasharray: 4 4; }
      .flow { fill: none; stroke: #8b95a3; stroke-width: 2; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#8b95a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="label" x="66" y="26" text-anchor="middle">PRODUCER</text>
  <text class="label" x="261" y="26" text-anchor="middle">TOPIC</text>
  <text class="label" x="456" y="26" text-anchor="middle">CONSUMER</text>

  <!-- Producer -->
  <rect class="card" x="24" y="40" width="84" height="152" rx="12"/>
  <rect x="47" y="54" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="66" y="73" dy=".35em" text-anchor="middle">1</text>
  <rect x="47" y="97" width="38" height="38" rx="8" fill="#ea580c"/><text class="num" x="66" y="116" dy=".35em" text-anchor="middle">2</text>
  <rect x="47" y="140" width="38" height="38" rx="8" fill="#059669"/><text class="num" x="66" y="159" dy=".35em" text-anchor="middle">3</text>
  <line class="flow" x1="120" y1="116" x2="166" y2="116" marker-end="url(#arrow)"/>

  <!-- Topic (encrypted) -->
  <rect class="card" x="178" y="83" width="166" height="66" rx="12"/>
  <rect x="194" y="97" width="38" height="38" rx="8" fill="#64748b"/><g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M208.5 114.5 v-3 a4.5 4.5 0 0 1 9 0 v3"/></g><rect x="205.5" y="114.5" width="15" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="242" y="97" width="38" height="38" rx="8" fill="#64748b"/><g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M256.5 114.5 v-3 a4.5 4.5 0 0 1 9 0 v3"/></g><rect x="253.5" y="114.5" width="15" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="290" y="97" width="38" height="38" rx="8" fill="#64748b"/><g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M304.5 114.5 v-3 a4.5 4.5 0 0 1 9 0 v3"/></g><rect x="301.5" y="114.5" width="15" height="11" rx="2.5" fill="#ffffff"/>
  <line class="flow" x1="356" y1="116" x2="402" y2="116" marker-end="url(#arrow)"/>

  <!-- Consumer -->
  <rect class="card" x="414" y="40" width="84" height="152" rx="12"/>
  <rect x="437" y="54" width="38" height="38" rx="8" fill="#3b82f6"/><text class="num" x="456" y="73" dy=".35em" text-anchor="middle">1</text>
  <rect x="437" y="97" width="38" height="38" rx="8" fill="#ea580c"/><text class="num" x="456" y="116" dy=".35em" text-anchor="middle">2</text>
  <rect x="437" y="140" width="38" height="38" rx="8" fill="#059669"/><text class="num" x="456" y="159" dy=".35em" text-anchor="middle">3</text>
</svg>
